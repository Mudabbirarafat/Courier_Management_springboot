name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: |
          if [ -f pom.xml ]; then
            mvn -B -ntp package -DskipTests
          elif [ -f gradlew ]; then
            chmod +x gradlew && ./gradlew build -x test
          else
            echo "::warning::no pom.xml or gradlew at the repo root"
          fi

      - name: Tests
        run: |
          if [ -f pom.xml ]; then
            mvn -B -ntp test
          fi
